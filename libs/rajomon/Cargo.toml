[package]
name = "rajomon"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rajomon token-based admission control with price propagation, as an rpcstack module"

# Depends on the rpcstack framework and generic libraries only: no Masa crate,
# no hyper (`scripts/validate_rpcstack_boundary.py` checks this).
[dependencies]
rpcstack = { path = "../rpcstack" }
tonic = { path = "../tonic/tonic", default-features = false, features = ["transport"] }
tokio = { path = "../tokio/tokio", features = ["rt", "time"] }
dashmap = "5.5"
once_cell = "1.20"
log = "0.4"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rpcstack-tonic = { path = "../rpcstack-tonic" }
http = "0.2"
tokio = { path = "../tokio/tokio", features = ["rt", "time", "macros"] }
